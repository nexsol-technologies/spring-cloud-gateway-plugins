name: build feature branches

on:
  pull_request:

concurrency:
  group: build-feature-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: build-feature
    runs-on: ubuntu-latest
    steps:

      - name: free disk space
        continue-on-error: true
        run: |
          df -h
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo apt clean
          docker rmi $(docker image ls -aq)
          df -h

      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: |
          mvn -B verify -P coverage --no-transfer-progress -D maven.javadoc.skip=true

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.dump*
            **/target/surefire-reports/*.out
            **/target/surefire-reports/*.err
          if-no-files-found: warn
          retention-days: 14