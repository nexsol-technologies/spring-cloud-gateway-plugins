name: build main

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest ]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:

      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: |
          mvn -B verify -P coverage --no-transfer-progress -D maven.javadoc.skip=true

      - uses: codecov/codecov-action@v4
        with:
          files: "*/jacoco.xml"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Deploys the artifacts the step above just built, in the same workspace: the
      # lifecycle is re-run up to 'deploy' but everything is up to date, so nothing is
      # recompiled and no test runs. Javadoc stays skipped, as it is for 'verify'.
      - name: Publish SNAPSHOT version to GitHub Packages
        run: mvn -B --no-transfer-progress deploy -DskipTests -D maven.javadoc.skip=true
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_GITHUB_PACKAGE_MAVEN }}

      - name: Extract Maven project version for Asciidoc GitHub Pages directory naming
        run: echo "version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> "$GITHUB_OUTPUT"
        id: project

      - name: Show extracted Maven project version
        run: echo ${{ steps.project.outputs.version }}

