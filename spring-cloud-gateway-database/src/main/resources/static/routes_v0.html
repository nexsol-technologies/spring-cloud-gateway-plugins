<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Routes</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@1.6.0/dist/flowbite.min.css" rel="stylesheet">
</head>
<body>
<div id="app" class="container mx-auto mt-5">
    <h1 class="text-2xl font-bold mb-4">Gestion des Routes</h1>

    <!-- Liste des routes -->
    <div class="mb-6">
        <h2 class="text-lg font-semibold mb-2">Routes existantes</h2>
        <ul v-if="routes.length > 0" class="list-disc pl-6">
            <li v-for="route in routes" :key="route.id">
                {{ route.routeId }} (Uri: {{ route.uri }})
                <button @click="loadRouteForEditing(route.id)" class="ml-2 text-blue-500">Éditer</button>
                <button @click="deleteRoute(route.id)" class="ml-2 text-red-500">Supprimer</button>
            </li>
        </ul>
        <p v-else>Aucune route disponible.</p>
    </div>

    <!-- Formulaire de création de route avec prédicats et filtres -->
    <div class="mb-6">
        <h2 class="text-lg font-semibold mb-2">
            {{ isEditing ? 'Modifier la route' : 'Créer une nouvelle route' }}
        </h2>
        <form @submit.prevent="isEditing ? updateRoute() : createRoute()">
            <div class="mb-4">
                <label for="routeName" class="block text-sm font-medium text-gray-700">Nom de la route</label>
                <input id="routeName" v-model="newRoute.routeId" type="text" required
                       class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div class="mb-4">
                <label for="routePath" class="block text-sm font-medium text-gray-700">URI</label>
                <input id="routePath" v-model="newRoute.uri" type="text" required
                       class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <!-- Prédicats -->
            <div v-for="(predicate, index) in newRoute.predicates" :key="index" class="mb-4">
                <label for="predicate" class="block text-sm font-medium text-gray-700">Prédicat</label>
				<div class="flex items-center gap-4">
	                <select v-model="predicate.name" @change="fetchPredicateArgs(index)"
							:class="{'border-red-500': predicateErrors[index]}"
	                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
	                    <option value="" disabled selected>Choisissez un prédicat</option>
	                    <option v-for="pred in predicates" :key="pred.name" :value="pred.name">
	                        {{ pred.name }}
	                    </option>
	                </select>
					<button @click="removePredicate(index)" type="button"
					                class="px-2 py-1 text-white bg-red-500 rounded hover:bg-red-600">
					            Supprimer
					        </button>
				</div>
				<p v-if="predicateErrors[index]" class="text-red-500 text-sm mt-1">Le prédicat est requis.</p>
				
                <!-- Arguments des prédicats -->
                <div v-if="predicateArgs[index]?.length > 0" class="mb-4">
                    <h3 class="text-sm font-medium">Arguments du prédicat :</h3>
                    <div v-for="arg in predicateArgs[index]" :key="arg" class="mb-2">
                        <label :for="'arg-' + arg">{{ arg }}</label>
                        <input :id="'arg-' + arg" v-model="predicate.args[arg]" type="text"
                               class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
                    </div>
                </div>
            </div>

            <button @click="addPredicate" type="button" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">
                Ajouter un prédicat
            </button>

            <!-- Filtres -->
            <div v-for="(filter, index) in newRoute.filters" :key="'filter-' + index" class="mb-4">
                <label for="filter" class="block text-sm font-medium text-gray-700">Filtre</label>
				<div class="flex items-center gap-4">
	                <select v-model="filter.name" @change="fetchFilterArgs(index)"
	                        class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
	                    <option value="" disabled selected>Choisissez un filtre</option>
	                    <option v-for="filterOption in filters" :key="filterOption.name" :value="filterOption.name">
	                        {{ filterOption.name }}
	                    </option>
	                </select>
					<button @click="removeFilter(index)" type="button"
					                class="px-2 py-1 text-white bg-red-500 rounded hover:bg-red-600">
					            Supprimer
					        </button>
				</div>
				
                <!-- Arguments des filtres -->
                <div v-if="filterArgs[index]?.length > 0" class="mb-4">
                    <h3 class="text-sm font-medium">Arguments du filtre :</h3>
                    <div v-for="arg in filterArgs[index]" :key="arg" class="mb-2">
                        <label :for="'filter-arg-' + arg">{{ arg }}</label>
                        <input :id="'filter-arg-' + arg" v-model="filter.args[arg]" type="text"
                               class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
                    </div>
                </div>
            </div>

            <button @click="addFilter" type="button" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600">
                Ajouter un filtre
            </button>

            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                {{ isEditing ? 'Mettre à jour la route' : 'Créer la route' }}
            </button>
        </form>
    </div>

</div>

<script>
const app = Vue.createApp({
    data() {
        return {
            routes: [], // Liste des routes existantes
            predicates: [], // Liste des prédicats disponibles
            filters: [], // Liste des filtres disponibles
            predicateArgs: [], // Arguments du prédicat sélectionné
            filterArgs: [], // Arguments du filtre sélectionné
            newRoute: {
                routeId: '', // Nom de la route
                uri: '', // URI de la route
                predicates: [{ name: '', args: {} }], // Liste des prédicats
                filters: [{ name: '', args: {} }], // Liste des filtres
            },
            isEditing: false, // Flag pour savoir si on est en mode édition
            currentRouteId: null, // ID de la route en cours d'édition
			predicateErrors: [] // Tableau d'erreurs pour les prédicats
        };
    },
    methods: {
        async fetchRoutes() {
            try {
                const response = await axios.get('/api/gateway/routes');
                this.routes = response.data;
            } catch (error) {
                console.error('Erreur lors de la récupération des routes :', error);
            }
        },
        async fetchPredicates() {
            try {
                const response = await axios.get('/api/gateway/routes/available-predicates');
                this.predicates = response.data;
            } catch (error) {
                console.error('Erreur lors de la récupération des prédicats :', error);
            }
        },
        async fetchFilters() {
            try {
                const response = await axios.get('/api/gateway/routes/available-filters');
                this.filters = response.data;
            } catch (error) {
                console.error('Erreur lors de la récupération des filtres :', error);
            }
        },
        async fetchPredicateArgs(index) {
            const predicateName = this.newRoute.predicates[index].name;
            if (!predicateName) return;
            try {
                const response = await axios.get(`/api/gateway/routes/available-predicates/${predicateName}/args`);
                this.predicateArgs[index] = response.data;
                this.newRoute.predicates[index].args = {};
                this.predicateArgs[index].forEach(arg => {
                    this.newRoute.predicates[index].args[arg] = ''; // Initialise chaque argument à une valeur vide
                });
            } catch (error) {
                console.error('Erreur lors de la récupération des arguments du prédicat :', error);
            }
        },
        async fetchFilterArgs(index) {
            const filterName = this.newRoute.filters[index].name;
            if (!filterName) return;
            try {
                const response = await axios.get(`/api/gateway/routes/available-filters/${filterName}/args`);
                this.filterArgs[index] = response.data;
                this.newRoute.filters[index].args = {};
                this.filterArgs[index].forEach(arg => {
                    this.newRoute.filters[index].args[arg] = ''; // Initialise chaque argument à une valeur vide
                });
            } catch (error) {
                console.error('Erreur lors de la récupération des arguments du filtre :', error);
            }
        },
        addPredicate() {
            this.newRoute.predicates.push({ name: '', args: {} });
            this.predicateArgs.push([]);
        },
        addFilter() {
            this.newRoute.filters.push({ name: '', args: {} });
            this.filterArgs.push([]);
        },
		removePredicate(index) {
	        this.newRoute.predicates.splice(index, 1);
	        this.predicateArgs.splice(index, 1); // Supprime aussi les arguments associés
	    },
	    removeFilter(index) {
	        this.newRoute.filters.splice(index, 1);
	        this.filterArgs.splice(index, 1); // Supprime aussi les arguments associés
	    },
		validatePredicates() {
		    // Vérifie si la liste des prédicats est vide ou inexistante
		    if (!this.newRoute.predicates || this.newRoute.predicates.length === 0) {
		        this.predicateErrors = [];
		        return false; // Retourne false car il n'y a aucun prédicat
		    }

		    // Réinitialise et valide chaque prédicat
		    this.predicateErrors = this.newRoute.predicates.map(predicate => !predicate.name);

		    // Vérifie s'il y a des erreurs
		    return this.predicateErrors.every(error => !error);
		},
    	async createRoute() {
			if (!this.validatePredicates()) {
	            alert('Veuillez corriger les erreurs avant de soumettre le formulaire.');
	            return;
	        }
            try {
                const routeData = {
                    routeId: this.newRoute.routeId,
                    uri: this.newRoute.uri,
                    predicates: this.newRoute.predicates,
                    filters: this.newRoute.filters.filter(f => f.name), // Filtrer les filtres vides
                };
                await axios.post('/api/gateway/routes', routeData);
                alert('Route créée avec succès !');
                this.fetchRoutes(); // Rafraîchir la liste des routes après création
                this.resetNewRoute(); // Réinitialiser le formulaire
            } catch (error) {
                console.error('Erreur lors de la création de la route :', error);
            }
        },
        async deleteRoute(id) {
            try {
                await axios.delete(`/api/gateway/routes/${id}`);
                alert('Route supprimée avec succès !');
                this.fetchRoutes(); // Rafraîchir la liste des routes après suppression
            } catch (error) {
                console.error('Erreur lors de la suppression de la route :', error);
            }
        },
        async loadRouteForEditing(id) {
            try {
                const response = await axios.get(`/api/gateway/routes/${id}`);
                const route = response.data;
                console.log('loadRouteForEditing route', route)
                this.newRoute = {
                    routeId: route.routeId,
                    uri: route.uri,
                    predicates: route.predicates || [{ name: '', args: {} }],
                    filters: route.filters || [{ name: '', args: {} }],
                };
				console.log('loadRouteForEditing this.newRoute', this.newRoute)
				                
                
                this.isEditing = true;
                this.currentRouteId = id;
				this.predicateArgs = this.newRoute.predicates.map(predicate =>
				    Object.keys(predicate.args || {})
				);
				this.filterArgs = this.newRoute.filters.map(filter =>
				    Object.keys(filter.args || {})
				);

            } catch (error) {
                console.error('Erreur lors du chargement de la route à éditer :', error);
            }
        },
        async updateRoute() {
			if (!this.validatePredicates()) {
	            alert('Veuillez corriger les erreurs avant de soumettre le formulaire.');
	            return;
	        }
            try {
                const routeData = {
                    routeId: this.newRoute.routeId,
                    uri: this.newRoute.uri,
                    predicates: this.newRoute.predicates,
                    filters: this.newRoute.filters.filter(f => f.name), // Filtrer les filtres vides
                };
                await axios.put(`/api/gateway/routes/${this.currentRouteId}`, routeData);
                alert('Route mise à jour avec succès !');
                this.fetchRoutes(); // Rafraîchir la liste des routes après mise à jour
                this.resetNewRoute(); // Réinitialiser le formulaire
                this.isEditing = false; // Sortir du mode édition
                this.currentRouteId = null;
            } catch (error) {
                console.error('Erreur lors de la mise à jour de la route :', error);
            }
        },
        resetNewRoute() {
            this.newRoute = {
                routeId: '',
                uri: '',
                predicates: [{ name: '', args: {} }],
                filters: [{ name: '', args: {} }],
            };
            this.predicateArgs = [];
            this.filterArgs = [];
        }
    },
    mounted() {
        this.fetchRoutes();
        this.fetchPredicates();
        this.fetchFilters();
    }
});
app.mount("#app");
</script>
</body>
</html>
