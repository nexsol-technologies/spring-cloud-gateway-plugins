spring.cloud.gateway.server.webflux:
  routes:
  - id: maintenance-open
    uri: forward:/maintenance
    predicates:
    - Path=/maintenance-open
    - Host=www.maintenance.ch
    filters:
    - name: Maintenance
      args:
        message: The shop is closed until 4am.
        start: 2025-09-01T22:00:00Z
        end: 2125-09-02T02:00:00Z
        status: 593
  - id: maintenance-planned
    uri: forward:/maintenance
    predicates:
    - Path=/maintenance-planned
    - Host=www.maintenance.ch
    filters:
    - name: Maintenance
      args:
        message: The shop will close tonight.
        start: 2125-09-01T22:00:00Z
