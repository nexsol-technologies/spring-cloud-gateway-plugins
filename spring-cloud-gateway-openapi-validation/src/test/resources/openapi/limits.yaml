openapi: 3.0.3
info:
  title: Limits
  version: 1.0.0
paths:
  /catalog:
    get:
      operationId: listCatalog
      parameters:
        - name: price
          in: query
          required: false
          schema:
            type: number
            multipleOf: 0.01
        - name: prices
          in: query
          required: false
          schema:
            type: array
            items:
              type: number
              multipleOf: 0.01
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: The items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      operationId: replaceCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Item'
      responses:
        '204':
          description: Replaced
  /categories:
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '204':
          description: Created
components:
  schemas:
    Item:
      type: object
      required: [name]
      properties:
        name:
          type: string
        price:
          type: number
          multipleOf: 0.01
    Category:
      type: object
      required: [name]
      properties:
        name:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Category'
