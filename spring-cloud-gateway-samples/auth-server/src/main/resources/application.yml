server.port: 9090
spring.application.name: auth-server

spring.security:
  oauth2:
    authorizationserver:
      client:
        messaging-client:
          registration:
            client-id: "messaging-client"
            client-secret: "$2y$10$kG0MX9l7jV.RMFPZrThreOfHfnM5.ZWr4kmAI9q/nMoEHwWHoON7a"
            client-authentication-methods:
              - "client_secret_basic"
            authorization-grant-types:
              - "authorization_code"
              - "refresh_token"
              - "client_credentials"
            redirect-uris:
              - "http://127.0.0.1:8080/login/oauth2/code/messaging-client-oidc"
              - "http://127.0.0.1:8080/authorized"
            post-logout-redirect-uris:
              - "http://127.0.0.1:8080/logged-out"
            scopes:
              - "openid"
              - "profile"
          require-authorization-consent: true


management:
  endpoints:
    web:
      exposure:
        include:
        - '*'
  endpoint:
    gateway:
      enabled: true
  