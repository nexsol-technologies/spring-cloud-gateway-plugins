# OpenAPI sources served by the Config Server, read by the 'routes-openapi' plugin through
# its 'sources-locations' (see spring-cloud-gateway-routes-openapi/README.md).
#
# This is a *sources* document, not a *routes* one: the plugin fetches each contract and
# generates the routes from it. The 'routes-configserver' plugin, which reads the
# orders-routes.yaml / billing-routes.yaml files next to this one, expects route
# definitions instead and would ignore this document.
#
# Served at: http://localhost:8888/gateway/default/main/openapi-sources.yaml
sources:
  - id: weather
    uri: https://api.weather.gov
    spec-url: https://api.weather.gov/openapi.json
    mode: AGGREGATED
    # base-path: /api/v3   # optional; derived from the contract servers when omitted
    metadata:
      source: configserver
      team: weather
    filters:
      - Retry=3
  - id: api.guru
    uri: https://api.apis.guru
    spec-url: https://api.apis.guru/v2/openapi.yaml
    mode: AGGREGATED
    # base-path: /api/v3   # optional; derived from the contract servers when omitted
    metadata:
      source: configserver
      team: guru
    filters:
      - Retry=3
