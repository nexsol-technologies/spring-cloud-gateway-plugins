server.port: 8201
spring.application.name: gateway-filters

spring.cloud.gateway.server.webflux:
  webfilter:
    # CorrelationId: every response carries an x-correlation-id header holding the
    # traceId of the current observation. It is a web filter, not a route filter, so it
    # applies to everything the gateway answers.
    correlation-id.enabled: true
  routes:

  # Authorization: the authenticated principal must carry one of the declared
  # authorities. 'user:user' is built with roles("READ"), which Spring Security renders
  # as the ROLE_READ authority — the value the filter compares against, prefix included.
  - id: authorization_granted
    uri: http://localhost:8080
    predicates:
    - Path=/authorization/**
    filters:
    - name: Authorization
      args:
        authorities: ROLE_READ
    - StripPrefix=1

  # The same route asking for an authority neither account holds: authenticated, and
  # still answered 403 by the filter.
  - id: authorization_denied
    uri: http://localhost:8080
    predicates:
    - Path=/authorization-ko/**
    filters:
    - name: Authorization
      args:
        authorities: ROLE_UNKNOWN
    - StripPrefix=1

  # ConvertHttpMethod: the gateway receives a GET, the backend receives a POST.
  # httpbin.org/anything echoes the method it was called with, which is the proof.
  - id: convert_http_method
    uri: https://httpbin.org
    predicates:
    - Path=/convert-method/**
    - Method=GET
    filters:
    - ConvertHttpMethod=POST
    - StripPrefix=1

  # Maintenance: the window has no bounds, so the route is closed right away and stays
  # closed. Nothing is forwarded — the 593 and its body come from the gateway itself.
  - id: maintenance
    uri: http://localhost:8080
    predicates:
    - Path=/maintenance/**
    filters:
    - name: Maintenance
      args:
        message: The shop is closed until 4am.
        status: 593
    - StripPrefix=1

  # The same maintenance, lifted for whoever holds ROLE_ADMIN: 'admin:admin' reaches
  # service-a, everyone else is answered 593. Basic authentication runs on every path of
  # this sample, so the credentials are enough to be recognised here.
  - id: maintenance_admin
    uri: http://localhost:8080
    predicates:
    - Path=/maintenance-admin/**
    filters:
    - name: Maintenance
      args:
        message: The shop is closed until 4am.
        allowed-authorities: [ROLE_ADMIN]
    - StripPrefix=1

  # A window with a known end: the answer carries a Retry-After naming it. The end is
  # exclusive, so it is the first moment a retry can succeed.
  - id: maintenance_bounded
    uri: http://localhost:8080
    predicates:
    - Path=/maintenance-bounded/**
    filters:
    - name: Maintenance
      args:
        message: The shop is closed until 4am.
        end: 2125-09-02T04:00:00+02:00
    - StripPrefix=1

  # Pre-maintenance: for the duration of the notice before the window opens, the route is
  # served exactly as it always was — 200 and the payload of service-a — and the answer
  # carries the window in its headers. The notice here runs from 2017 to 2126 so the sample
  # is always in it whichever day you run it; a real one reads 'notice: 3d'.
  - id: maintenance_notice
    uri: http://localhost:8080
    predicates:
    - Path=/maintenance-notice/**
    filters:
    - name: Maintenance
      args:
        message: Maintenance prévue le 1er septembre.
        notice: 40000d
        start: 2126-09-01T22:00:00Z
        end: 2126-09-02T02:00:00Z
    - StripPrefix=1

  # A planned maintenance: the window opens in 2125, so the route is served normally until
  # then. Both bounds carry their offset — a value without one is rejected on startup.
  - id: maintenance_planned
    uri: http://localhost:8080
    predicates:
    - Path=/maintenance-planned/**
    filters:
    - name: Maintenance
      args:
        message: The shop will close for the night.
        start: 2125-09-01T22:00:00Z
        end: 2125-09-02T02:00:00+02:00
    - StripPrefix=1

  # Recaptcha: verifies a CAPTCHA score against Google reCAPTCHA. It needs a secret key
  # issued by Google, so the sample declares it commented out rather than shipping a
  # route that cannot answer.
  # - id: recaptcha
  #   uri: http://localhost:8080
  #   predicates:
  #   - Path=/recaptcha/**
  #   filters:
  #   - name: Recaptcha
  #     args:
  #       verify-url: https://www.google.com/recaptcha/api/siteverify
  #       version: V3
  #       secret-key: ${RECAPTCHA_SECRET_KEY}
  #       recaptcha-http-header: recaptcha
  #       score: 50   # v3 only, on a 0-100 scale; Google recommends 0.5
  #   - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include:
        - health
        - info
        - gateway
  endpoint:
    gateway:
      access: read-only
  tracing:
    enabled: true
    sampling:
      probability: 1

logging:
  level:
    '[ch.nexsol]': debug
