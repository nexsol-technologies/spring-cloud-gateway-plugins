# A second instance of this gateway, to watch the consolidating metrics sources add up.
# Combine it with the source being tried, this profile last so it keeps the port and the
# identity whatever the other one sets:
#   mvn spring-boot:run -Dspring-boot.run.profiles=metrics-redis,instance2
#   mvn spring-boot:run -Dspring-boot.run.profiles=metrics-prometheus,instance2
#   mvn spring-boot:run -Dspring-boot.run.profiles=metrics-discovery,instance2
#
# What each source needs from it:
#   redis      - nothing else; the second instance publishes its own key and the coverage
#                under the chart reads '2 instances, via Redis'.
#   prometheus - uncomment the 8191 target in prometheus.yml and restart the container,
#                or Prometheus never scrapes this instance.
#   discovery  - nothing else; it registers under the same service id and is polled.
#
# The two instances share whatever is outside the JVM — the Redis keys, the Eureka
# registration — and nothing else: the database routes run on a private in-memory H2 here,
# so each has its own. Point both at the pgsql profile to share those too.
server.port: 8191

spring.cloud.gateway.server.webflux.metrics.instance-id: gateway-full-2
