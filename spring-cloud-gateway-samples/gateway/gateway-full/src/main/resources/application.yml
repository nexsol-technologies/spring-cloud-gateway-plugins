server.port: 8181
spring.application.name: gateway

spring.cloud.gateway.server.webflux:
  webfilter:
    correlation-id.enabled: true
  globalcors:
    cors-configurations:
      '[/**]':
        allowedOrigins: '*'
        allowedHeaders: '*'
        allowedMethods:
        - GET
        - POST
        - OPTIONS
  routes:
  - id: test-authorization
    uri: http://localhost:8080
    predicates:
    - Path=/test-authorization/sample
    filters:
    # The Basic-auth user is built with roles("READ"), which Spring Security renders as
    # the ROLE_READ authority — the value the filter compares against, prefix included.
    - name: Authorization
      args:
        authorities: ROLE_READ
    - RewritePath=/test-authorization/?(?<segment>.*), /$\{segment}

  - id: test-authorization-token-OK
    uri: http://localhost:8080
    predicates:
    - Path=/test-authorization-token/sample
    filters:
    - name: AuthorizationToken
      args:
        issuers: ''
        client-ids:
        grant-accesses:
        - jsonPath: '$.roles'
          roles: 'READ'
    - RewritePath=/test-authorization-token/?(?<segment>.*), /$\{segment}

  - id: test-authorization-token-KO
    uri: http://localhost:8080
    predicates:
    - Path=/test-authorization-token-ko/sample
    filters:
    - name: AuthorizationToken
      args:
        issuers: 
        client-ids:
        grant-accesses:
        - jsonPath: '$.roles'
          roles: '_UNKNOWN_ROLE_'
    - RewritePath=/test-authorization-token/?(?<segment>.*), /$\{segment}


# Route definition management plugins (spring-cloud-gateway-routes).
# 'routes-files' aggregates JSON/YAML route files into the route locator (GitOps friendly).
# 'routes-openapi' turns an OpenAPI contract into routes (needs a reachable spec).
spring.cloud.gateway.server.webflux.routes-files:
  enabled: true
  watch: true
  locations:
    - classpath:gateway-routes/*.yaml
spring.cloud.gateway.server.webflux.routes-openapi:
  enabled: true
  update-interval: 5m
  sources:
   - id: petstore
     uri: https://petstore3.swagger.io
     spec-url: https://petstore3.swagger.io/api/v3/openapi.json
     mode: PER_OPERATION
     # base-path: /api/v3   # optional; derived from the contract servers when omitted
     metadata:
       team: pets
     filters:
       - Retry=3
     # Generating the routes from a contract does not validate the traffic against it.
     # This does: it attaches the OpenapiValidation filter, reusing the 'spec-url' and
     # 'path-prefix' above so they cannot drift apart, and puts it ahead of every other
     # filter — a request breaking the contract is denied before the Retry budget is spent
     # on it. Note that no metadata turns validation on; 'metadata' above is only carried
     # onto the route, nothing reads it.
     #
     # To hold the traffic against a *different* document than the routes came from — a
     # stricter contract, say — leave this off and write the filter by hand instead:
     #   - OpenapiValidation=classpath:openapi/petstore-strict.yaml
     validate: true

# Holds the traffic of the routes carrying the OpenapiValidation filter against their
# contract (spring-cloud-gateway-openapi-validation). These are the defaults, spelled out:
# a malformed request is denied, while a backend answering outside its own contract is
# measured rather than turned into a gateway error.
spring.cloud.gateway.server.webflux.openapi-validation:
  request:
    mode: ENFORCE           # ENFORCE | REPORT | OFF
    validate-body: true
    max-body-size: 1MB
  response:
    mode: REPORT
    validate-body: true
    max-body-size: 1MB

# Traffic and instance figures (spring-cloud-gateway-metrics). No provider: the figures
# are those of this instance. See the gateway-metrics sample for the consolidating
# sources.
spring.cloud.gateway.server.webflux.metrics:
  excluded-routes:
    - openapi-docs-.*
  instance:
    # Publishes the Reactor Netty event loop and HTTP client counters, which the gateway
    # leaves off. It puts a metrics recorder in the pipeline of every connection, so it
    # is a real cost on the data path — on here so the instances view is complete.
    instrument-http-client: true

# Publishes the connection pool counters the instances view plots. A gateway property
# rather than a plugin one: it is read while the HTTP client is being built, too early
# for any bean to turn it on.
spring.cloud.gateway.server.webflux.httpclient.pool.metrics: true

# Auditing (spring-cloud-gateway-audit). No provider either: the default publisher logs
# each event and republishes it as a Spring application event. See the gateway-audit
# sample for the Redis, Kafka and R2DBC providers.
spring.cloud.gateway.server.webflux.audit:
  enabled: true
  metadata:
    environment: sample
  web-filter:
    enabled: true

spring.cloud.gateway.server.webflux.ui:
  openapi:
    extensions:
      x-roles: Required roles
      x-from-application-version: Since
  security:
    mode: authenticated
    user:
      name: superadmin
      password: ${ADMIN_PASSWORD:superadmin}
      roles:
      - ADMIN

# CASE_INSENSITIVE_IDENTIFIERS is what makes H2 accept the quoted lower-case identifiers
# Spring Data R2DBC generates against the schema the plugin ships, whose DDL is unquoted.
spring.r2dbc:
  url: r2dbc:h2:mem:///test_db?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE

spring:
  security:
    oauth2:
      resourceserver:
#        granted-authorities-mapping:
#          json-path:
#          - '$.my-custom-roles'
        multitenant:
        - id: local
          issuer-uri: http://localhost:9090
        - id: local2
          issuer-uri: http://localhost:9090
        jwt:
          issuer-uri: http://localhost:9090

management:
  endpoints:
    web:
      exposure:
        include:
        - '*'
  endpoint:
    gateway:
      access: read-only
  tracing:
    sampling:
      probability: 1
    export:
      enabled: true
    
logging:
  level:
    '[ch.nexsol]': debug
    '[org.springframework]': info
    '[org.springframework.boot]': debug
---
spring:
  config:
    activate:
      on-profile:
      - pgsql
  r2dbc:
    url: r2dbc:postgresql://localhost:15432/scg
    username: spring_cloud_gateway
    password: spring_cloud_gateway
spring.sql.init.mode: always 
---
spring:
  config:
    activate:
      on-profile:
      - eureka
eureka:
  client:
    enabled: true
    fetch-registry: true
spring.cloud.gateway.server.webflux:
  discovery:
    locator:
      enabled: true
spring.cloud.gateway.server.webflux.hub-openapi:
  enabled: true
  gateway-uri: http://localhost:${server.port}