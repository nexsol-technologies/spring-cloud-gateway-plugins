server.port: 8181
spring.application.name: gateway

spring.cloud.gateway.server.webflux:
  webfilter:
    correlation-id.enabled: true
  globalcors:
    cors-configurations:
      '[/**]':
        allowedOrigins: '*'
        allowedHeaders: '*'
        allowedMethods:
        - GET
        - POST
        - OPTIONS
  routes:
  - id: test-authorization
    uri: http://localhost:8080
    predicates:
    - Path=/test-authorization/sample
    filters:
    # The Basic-auth user is built with roles("READ"), which Spring Security renders as
    # the ROLE_READ authority — the value the filter compares against, prefix included.
    - name: Authorization
      args:
        authorities: ROLE_READ
    - RewritePath=/test-authorization/?(?<segment>.*), /$\{segment}

  - id: test-authorization-token-OK
    uri: http://localhost:8080
    predicates:
    - Path=/test-authorization-token/sample
    filters:
    - name: AuthorizationToken
      args:
        issuers: ''
        client-ids:
        grant-accesses:
        - jsonPath: '$.roles'
          roles: 'READ'
    - RewritePath=/test-authorization-token/?(?<segment>.*), /$\{segment}

  # The two flows of the service graph sample. 'service-a' is what a browser calls;
  # 'service-b' is what service-a calls back through this gateway, which is the hop that
  # puts the edge service-a -> service-b in the graph. Its other flow, calling service-b
  # directly, never reaches here — and that is the point: no counter of this gateway can
  # draw an edge it never carried.
  #
  # The target is a placeholder so the 'eureka' profile can point these two at the
  # registry without repeating the whole route list. It also decides how the graph names
  # the far end of the edge, which is read from the route URI: 'localhost:8080' here, and
  # 'service-a' once the load balancer resolves it.
  - id: service-a
    uri: ${sample.service-a.uri:http://localhost:8080}
    predicates:
    - Path=/service-a/**
    filters:
    - StripPrefix=1

  - id: service-b
    uri: ${sample.service-b.uri:http://localhost:8081}
    predicates:
    - Path=/service-b/**
    filters:
    - StripPrefix=1

  - id: test-authorization-token-KO
    uri: http://localhost:8080
    predicates:
    - Path=/test-authorization-token-ko/sample
    filters:
    - name: AuthorizationToken
      args:
        issuers: 
        client-ids:
        grant-accesses:
        - jsonPath: '$.roles'
          roles: '_UNKNOWN_ROLE_'
    - RewritePath=/test-authorization-token/?(?<segment>.*), /$\{segment}


# Route definition management plugins (spring-cloud-gateway-routes).
# 'routes-files' aggregates JSON/YAML route files into the route locator (GitOps friendly).
# 'routes-openapi' turns an OpenAPI contract into routes (needs a reachable spec).
spring.cloud.gateway.server.webflux.routes-files:
  enabled: true
  watch: true
  locations:
    - classpath:gateway-routes/*.yaml
spring.cloud.gateway.server.webflux.routes-openapi:
  enabled: true
  update-interval: 5m
  sources:
   - id: petstore
     uri: https://petstore3.swagger.io
     spec-url: https://petstore3.swagger.io/api/v3/openapi.json
     mode: PER_OPERATION
     # base-path: /api/v3   # optional; derived from the contract servers when omitted
     metadata:
       team: pets
     filters:
       - Retry=3
     # Generating the routes from a contract does not validate the traffic against it.
     # This does: it attaches the OpenapiValidation filter, reusing the 'spec-url' and
     # 'path-prefix' above so they cannot drift apart, and puts it ahead of every other
     # filter — a request breaking the contract is denied before the Retry budget is spent
     # on it. Note that no metadata turns validation on; 'metadata' above is only carried
     # onto the route, nothing reads it.
     #
     # To hold the traffic against a *different* document than the routes came from — a
     # stricter contract, say — leave this off and write the filter by hand instead:
     #   - OpenapiValidation=classpath:openapi/petstore-strict.yaml
     validate: true

# Holds the traffic of the routes carrying the OpenapiValidation filter against their
# contract (spring-cloud-gateway-openapi-validation). These are the defaults, spelled out:
# a malformed request is denied, while a backend answering outside its own contract is
# measured rather than turned into a gateway error.
spring.cloud.gateway.server.webflux.openapi-validation:
  request:
    mode: ENFORCE           # ENFORCE | REPORT | OFF
    validate-body: true
    max-body-size: 1MB
  response:
    mode: REPORT
    validate-body: true
    max-body-size: 1MB

# Traffic and instance figures (spring-cloud-gateway-metrics). No provider by default: the
# figures are those of this instance. The 'metrics-redis', 'metrics-prometheus' and
# 'metrics-discovery' profiles at the end of this file each put a consolidating source
# behind it.
spring.cloud.gateway.server.webflux.metrics:
  # Defaults to the host name, the pod name on Kubernetes. Set here so the coverage line
  # under the chart reads the same whatever machine the sample runs on, and so the
  # 'instance2' profile has one value to override.
  instance-id: gateway-full-1
  excluded-routes:
    - openapi-docs-.*
  instance:
    # Publishes the Reactor Netty event loop and HTTP client counters, which the gateway
    # leaves off. It puts a metrics recorder in the pipeline of every connection, so it
    # is a real cost on the data path — on here so the instances view is complete.
    instrument-http-client: true

# Who calls what (spring-cloud-gateway-service-graph). No provider by default: the graph is
# the one this instance counted.
#
#   mvn spring-boot:run                     # in samples/service-b, then samples/service-a
#   curl -H 'X-Caller: frontend' localhost:8181/service-a/call-through-gateway
#   curl -H 'X-Caller: frontend' localhost:8181/service-a/call-direct
#
# The first call draws two edges — frontend -> service-a and service-a -> service-b — the
# second only one, because its second hop never reached this gateway.
spring.cloud.gateway.server.webflux.service-graph:
  instance-id: gateway-full-1
  # There is no path exclusion to write next to the audit one above: the graph counts
  # routed exchanges only, and /actuator and /eureka are served by this gateway rather than
  # routed by it, so they never reach the counter. What is excluded here is excluded by
  # route id.
  # Left out of the graph: fetching a contract is not one service calling another.
  excluded-routes:
    - openapi-docs-.*
  caller:
    # These samples carry no token, so the calling service names itself in a header. A
    # deployment where service-a presents its own token needs none of this: 'azp' names it
    # and the claims are read first. Note that a header is chosen by whoever calls — it is
    # trusted here because everything on this machine is.
    header: X-Caller

# Publishes the connection pool counters the instances view plots. A gateway property
# rather than a plugin one: it is read while the HTTP client is being built, too early
# for any bean to turn it on.
spring.cloud.gateway.server.webflux.httpclient.pool.metrics: true

# Auditing (spring-cloud-gateway-audit). No provider either: the default publisher logs
# each event and republishes it as a Spring application event. See the gateway-audit
# sample for the Redis, Kafka and R2DBC providers.
spring.cloud.gateway.server.webflux.audit:
  enabled: true
  metadata:
    environment: sample
  web-filter:
    enabled: true
    # The web filter audits whatever this gateway serves, its own endpoints included, and a
    # probe polling /actuator/health or a Prometheus scraping /actuator/prometheus is not
    # gateway traffic. '/actuator' is listed next to '/actuator/**' because the pattern
    # matches what is under the path, not the path itself. '/eureka/**' is a guard for a
    # deployment proxying the registry through the gateway; nothing serves it here, since
    # the Eureka client of this gateway calls the registry directly. The console adds the
    # paths of its own views on its own, which is why they are not repeated here.
    exclude-paths:
    - /actuator
    - /actuator/**
    - /eureka/**

spring.cloud.gateway.server.webflux.ui:
  openapi:
    extensions:
      x-roles: Required roles
      x-from-application-version: Since
  security:
    mode: authenticated
    user:
      name: superadmin
      password: ${ADMIN_PASSWORD:superadmin}
      roles:
      - ADMIN
    # The console names the issuer it accepts Bearer tokens from, apart from the one the
    # gateway validates the traffic it routes against further down this file. Both happen
    # to be the sample authorization server here, and that is the point of writing it
    # twice: the two are independent, and pointing the console at another provider is a
    # one-line change that leaves the routes alone.
    #
    # The keys are fetched on the first token that arrives, so this gateway starts with
    # nothing listening on 9090.
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CONSOLE_ISSUER_URI:http://localhost:9090}

# CASE_INSENSITIVE_IDENTIFIERS is what makes H2 accept the quoted lower-case identifiers
# Spring Data R2DBC generates against the schema the plugin ships, whose DDL is unquoted.
spring.r2dbc:
  url: r2dbc:h2:mem:///test_db?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE

spring:
  security:
    oauth2:
      resourceserver:
#        granted-authorities-mapping:
#          json-path:
#          - '$.my-custom-roles'
        multitenant:
        - id: local
          issuer-uri: http://localhost:9090
        - id: local2
          issuer-uri: http://localhost:9090
#OU activer uniquement
        jwt:
          issuer-uri: http://localhost:9090

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: 6379
  password: ${REDIS_PASSWORD:}
spring.session:
  timeout: 30m
  data.redis.namespace: gateway:console
          
management:
  endpoints:
    web:
      exposure:
        include:
        - '*'
  endpoint:
    gateway:
      access: read-only
  tracing:
    sampling:
      probability: 1
    export:
      enabled: true
    
logging:
  level:
    '[ch.nexsol]': debug
    '[org.springframework]': info
    '[org.springframework.boot]': debug
---
spring:
  config:
    activate:
      on-profile:
      - pgsql
  r2dbc:
    url: r2dbc:postgresql://localhost:15432/scg
    username: spring_cloud_gateway
    password: spring_cloud_gateway
spring.sql.init.mode: always 
---
spring:
  config:
    activate:
      on-profile:
      - eureka
eureka:
  client:
    enabled: true
    fetch-registry: true
# The sample routes now go through the load balancer, which is also what makes the service
# graph name their far end 'service-a' and 'service-b' rather than an address.
#
# Both backends have to run under their own 'eureka' profile for that: they do not register
# otherwise, the load balancer then finds no instance, and the gateway answers 503 — which
# reads like the service being down rather than like it never having registered.
sample:
  service-a.uri: lb://service-a
  service-b.uri: lb://service-b
spring.cloud.gateway.server.webflux:
  discovery:
    locator:
      # Adds one route per registered service, '/SERVICE-A/**' -> 'lb://SERVICE-A', with an
      # id of its own. It does not collide with the two routes above: Eureka upper cases a
      # service id and path matching is case sensitive, so the paths differ. Turning
      # 'lower-case-service-id' on would make them the same path served by two routes, and
      # the same service drawn under two names in the graph.
      enabled: true
spring.cloud.gateway.server.webflux.hub-openapi:
  enabled: true
  gateway-uri: http://localhost:${server.port}
  security:
    # The contracts the hub aggregates name the issuer each service validates its own
    # traffic against, which in a cluster is an address a browser cannot resolve. This
    # advertises the issuers of this gateway instead — the multitenant list further up this
    # file, so 'local' and 'local2' are offered as the two tenants they are, and a token
    # good enough for the routed traffic is what the console obtains.
    issuer: gateway
---
# Each instance publishes what it counted into Redis; the view sums whatever is there.
#   docker compose up -d redis
#   mvn spring-boot:run -Dspring-boot.run.profiles=metrics-redis
# Start a second instance to see the figures consolidate — the 'instance2' profile is that
# instance, on its own port and under its own identity:
#   mvn spring-boot:run -Dspring-boot.run.profiles=metrics-redis,instance2
spring:
  config:
    activate:
      on-profile:
      - metrics-redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
spring.cloud.gateway.server.webflux.metrics:
  provider: redis
  redis:
    key-prefix: "gateway:metrics:"
    # A namespace of its own rather than a suffix under key-prefix: the route source scans
    # that prefix with a wildcard and would pick these entries up only to discard them,
    # one warning each, on every refresh.
    instance-key-prefix: "gateway:instances:"
    publish-interval: 10s
    # Comfortably longer than the publish interval, or an instance disappears from the
    # figures between two of its own writes.
    time-to-live: 45s
---
# Reads the consolidated figures from Prometheus. The only source that survives a restart:
# the series outlive the JVM that produced them.
#   docker compose up -d prometheus
#   mvn spring-boot:run -Dspring-boot.run.profiles=metrics-prometheus
spring:
  config:
    activate:
      on-profile:
      - metrics-prometheus
spring.cloud.gateway.server.webflux.metrics:
  provider: prometheus
  prometheus:
    # 9091, so it does not collide with the auth-server sample on 9090.
    url: http://localhost:9091
    # Set it unless this gateway is the only publisher of the meter: a shared Prometheus
    # otherwise mixes the traffic of every gateway into one figure.
    selector: job="gateway-full"
    meter: spring_cloud_gateway_requests_seconds
    timeout: 5s
    # The scrape target Prometheus stamps every series with, a host and port rather than
    # the instance-id above: the instances view names its rows differently here than under
    # the other providers.
    instance-label: instance
    # Prometheus keeps the series of instances that no longer run. Anything that stopped
    # reporting for longer than this drops out of the instances view.
    stale-after: 2m
---
# Polls every instance registered under this gateway's own service id and sums the answers.
# Needs the 'eureka' sample on :8761, and a second instance to consolidate.
#   mvn spring-boot:run -Dspring-boot.run.profiles=metrics-discovery
#   mvn spring-boot:run -Dspring-boot.run.profiles=metrics-discovery,instance2
# It composes with the 'eureka' profile above, which adds the discovery route locator and
# the OpenAPI hub: -Dspring-boot.run.profiles=eureka,metrics-discovery
spring:
  config:
    activate:
      on-profile:
      - metrics-discovery
eureka:
  client:
    enabled: true
    fetch-registry: true
    register-with-eureka: true
spring.cloud.gateway.server.webflux.metrics:
  provider: discovery
  discovery:
    # Left to spring.application.name, which is what the instances register under.
    service-id:
    path: /ui/metrics/local
    instance-path: /ui/metrics/local/instance
    timeout: 3s
---
# Every plugin off, from configuration alone: the same jar and the same classpath, and a
# gateway that routes traffic and does nothing else.
#   mvn spring-boot:run -Dspring-boot.run.profiles=plugins-off
# What still answers is what the gateway itself provides: the routes below, /actuator, and
# the filter factories the routes name — a filter factory is only applied by a route asking
# for it, so it has nothing to turn off.
spring:
  config:
    activate:
      on-profile:
      - plugins-off
  autoconfigure:
    # The console carries no switch of its own: it is wired on the strength of being on the
    # classpath. Boot's own exclude list is the property that turns it off. It works
    # differently from the switches below — it silences the auto-configuration altogether,
    # so /ui answers 404 rather than answering that it is disabled.
    exclude:
    - ch.nexsol.gateway.ui.autoconfigure.GatewayUiAutoConfiguration
    - ch.nexsol.gateway.ui.autoconfigure.GatewayUiSecurityAutoConfiguration
spring.cloud.gateway.server.webflux:
  # routes-database: the whole plugin, the route source included. Its own 'access' would
  # only have closed the endpoints and left the database feeding the gateway, which is not
  # what this profile is about.
  routes-database.enabled: false
  webfilter:
    # filters: the correlation-id web filter, the only thing that plugin puts on every
    # request. Its filter factories stay registered and unused.
    correlation-id.enabled: false
    # oauth2: the Basic-auth to Bearer exchange, likewise the only global piece.
    basicauth-exchange-oauth2.enabled: false
  routes-files.enabled: false
  routes-openapi.enabled: false
  routes-configserver.enabled: false
  routes-security.public-routes.enabled: false
  hub-openapi.enabled: false
  audit:
    enabled: false
    web-filter.enabled: false
  metrics:
    enabled: false
    instance.enabled: false
  # openapi-validation has no enabled flag, for a reason of its own: it is attached route
  # by route, and both directions on OFF is what neutralises it wherever a route attached
  # it. Quoted, or YAML reads OFF as the boolean false.
  openapi-validation:
    request.mode: "OFF"
    response.mode: "OFF"