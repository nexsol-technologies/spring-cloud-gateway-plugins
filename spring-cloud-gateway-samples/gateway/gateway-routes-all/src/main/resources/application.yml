server.port: 8210
spring.application.name: gateway-routes-all

# --- Source 1: the properties ------------------------------------------------------
spring.cloud.gateway.server.webflux:
  routes:
  - id: properties_route
    uri: https://httpbin.org
    predicates:
    - Path=/from-properties/**
    filters:
    - StripPrefix=1

# --- Source 2: JSON/YAML files (GitOps friendly) -----------------------------------
spring.cloud.gateway.server.webflux.routes-files:
  enabled: true
  watch: true
  locations:
  - classpath:gateway-routes/*.yaml

# --- Source 3: an OpenAPI contract turned into routes ------------------------------
spring.cloud.gateway.server.webflux.routes-openapi:
  enabled: true
  update-interval: 5m
  sources:
  - id: petstore
    uri: https://petstore3.swagger.io
    spec-url: https://petstore3.swagger.io/api/v3/openapi.json
    mode: PER_OPERATION
    path-prefix: /petstore
    metadata:
      # routes-security reads this, whatever the source declared it: the generated
      # petstore routes are reachable without credentials.
      public: true

# --- Source 4: a Config Server, under the 'configserver' profile --------------------
# --- Source 5: the database, always on, managed at /ui/routes/db --------------------

# The database source. H2 in memory by default; the pgsql profile points it at the
# PostgreSQL the docker-compose file starts. The plugin ships the schema, which Spring
# Boot runs on an embedded database on its own.
# CASE_INSENSITIVE_IDENTIFIERS is what makes H2 accept the quoted lower-case identifiers
# Spring Data R2DBC generates against the schema the plugin ships, whose DDL is unquoted.
spring.r2dbc:
  url: r2dbc:h2:mem:///routes_db?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE

# This sample is about where routes come from, not about who may change them, and it is
# meant to be browsed without signing in. The console is open by default, and this says
# that the endpoints changing the routing table (/ui/routes/db, /api/gateway/routes) follow
# it rather than asking for the Basic credentials the application declares. Any gateway
# that is not a local demo should leave this alone: the default closes them as soon as
# there is anything to authenticate against.
spring.cloud.gateway.server.webflux.ui.security:
  write-mode: permit-all

management:
  endpoints:
    web:
      exposure:
        include:
        - health
        - info
        - gateway
        - refresh
  endpoint:
    gateway:
      access: read-only

logging:
  level:
    '[ch.nexsol]': debug
---
# Route files served by the 'config-server' sample on :8888. Start it first:
#   mvn spring-boot:run -Dspring-boot.run.profiles=configserver
spring:
  config:
    activate:
      on-profile:
      - configserver
spring.cloud.gateway.server.webflux.routes-configserver:
  enabled: true
  update-interval: 30s
  config-server:
    uri: http://localhost:8888
    name: gateway
    profile: default
    label: main
    files:
    - orders-routes.yaml
    - billing-routes.yaml
---
# The database source on PostgreSQL rather than H2.
#   docker compose up -d
#   mvn spring-boot:run -Dspring-boot.run.profiles=pgsql
spring:
  config:
    activate:
      on-profile:
      - pgsql
  r2dbc:
    url: r2dbc:postgresql://localhost:15432/gateway_routes
    username: gateway
    password: gateway
  sql:
    init:
      mode: always
