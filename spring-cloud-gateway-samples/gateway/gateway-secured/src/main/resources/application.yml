server.port: 8211
spring.application.name: gateway-secured

# Requires the 'auth-server' sample on :9090.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090

spring.cloud.gateway.server.webflux.routes-files:
  enabled: true
  watch: true
  locations:
  - classpath:gateway-routes/*.yaml

spring.cloud.gateway.server.webflux:
  webfilter:
    correlation-id.enabled: true
  routes:

  # Authenticated by the chain, then authorized by the AuthorizationToken filter: the
  # token must have been issued by the sample authorization server.
  - id: secured_by_issuer
    uri: http://localhost:8080
    predicates:
    - Path=/secured/**
    filters:
    - name: AuthorizationToken
      args:
        issuers: http://localhost:9090
    - StripPrefix=1

  # Authenticated by the chain, then authorized on the authorities the resource server
  # mapped out of the token. This is the filters plugin, not the oauth2 one: it reads the
  # GrantedAuthority entries, whatever produced them.
  - id: secured_by_authority
    uri: http://localhost:8080
    predicates:
    - Path=/secured-read/**
    filters:
    - name: Authorization
      args:
        authorities: READ
    - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include:
        - health
        - info
        - gateway
        - refresh
  endpoint:
    gateway:
      access: read-only
  tracing:
    enabled: true
    sampling:
      probability: 1

logging:
  level:
    '[ch.nexsol]': debug
