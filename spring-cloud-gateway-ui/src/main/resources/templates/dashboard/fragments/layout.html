<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, scripts)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${title}">Spring Cloud Gateway</title>
	<link rel="icon" type="image/png" th:href="@{/img/icon.png}" href="/img/icon.png">
	<link rel="apple-touch-icon" th:href="@{/img/icon.png}" href="/img/icon.png">
	<!--
		The theme is applied before the stylesheets paint, otherwise a dark page would flash
		light on every load. The choice made in the side menu wins over the one the operating
		system reports.
	-->
	<script>
		(function () {
			var chosen = null;
			try {
				chosen = localStorage.getItem('gw-theme');
			}
			catch (ignored) {
				// Storage refused by the browser: the system preference decides.
			}
			document.documentElement.setAttribute('data-bs-theme',
					chosen || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
		})();
	</script>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/gateway-ui.css}" href="/css/gateway-ui.css">
	<!--
		Only present once the console authenticates. gateway-ui.js reads them to put the CSRF
		token on every HTMX request, which is what lets the console keep its writes (reloading
		the route table, running the route tester) behind a session cookie.
	-->
	<th:block th:if="${_csrf != null}">
		<meta name="_csrf" th:content="${_csrf.token}">
		<meta name="_csrf_header" th:content="${_csrf.headerName}">
	</th:block>
</head>
<body class="bg-body-tertiary">
	<!-- Inline SVG sprite: each NavItem references a symbol by id through its icon field. -->
	<svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
		<symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
		</symbol>
		<symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>
		</symbol>
		<symbol id="icon-plugin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/>
			<rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>
		</symbol>
		<symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M4 4v16h16"/>
			<circle cx="9" cy="14.5" r="1.7" fill="currentColor" stroke="none"/>
			<circle cx="13.5" cy="9" r="1.7" fill="currentColor" stroke="none"/>
			<circle cx="18" cy="12.5" r="1.7" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-graph" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- One caller reaching two services: the shape of the graph the view draws. -->
			<path d="M7.8 11.2 15 6.6"/>
			<path d="M7.8 12.8 15 17.4"/>
			<circle cx="5.5" cy="12" r="2.5"/>
			<circle cx="17.5" cy="5.5" r="2.5"/>
			<circle cx="17.5" cy="18.5" r="2.5"/>
		</symbol>
		<symbol id="icon-server" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- Two stacked instances, each with its own status light. -->
			<rect x="3.5" y="4.5" width="17" height="6" rx="1.6"/>
			<rect x="3.5" y="13.5" width="17" height="6" rx="1.6"/>
			<circle cx="7" cy="7.5" r="1.1" fill="currentColor" stroke="none"/>
			<circle cx="7" cy="16.5" r="1.1" fill="currentColor" stroke="none"/>
			<path d="M11 7.5h6"/>
			<path d="M11 16.5h6"/>
		</symbol>
		<symbol id="icon-route" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- A path branching from one entry point to two exits. -->
			<path d="M6 19V9a3 3 0 0 1 3-3h9"/>
			<path d="M15 3l3 3-3 3"/>
			<path d="M6 13h6a3 3 0 0 1 3 3v2"/>
			<circle cx="6" cy="20.5" r="1.5" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- Concentric rings: testing a request against the route table. -->
			<circle cx="12" cy="12" r="8.5"/>
			<circle cx="12" cy="12" r="4.5"/>
			<circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- A log: successive entries, newest on top. -->
			<path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/>
			<circle cx="4.75" cy="6" r="1.3" fill="currentColor" stroke="none"/>
			<circle cx="4.75" cy="12" r="1.3" fill="currentColor" stroke="none"/>
			<circle cx="4.75" cy="18" r="1.3" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- An open book: the API contracts served by the gateway. -->
			<path d="M12 6.5C10.4 5.2 8.4 4.6 5.5 4.6H3.5v13h2c2.9 0 4.9.6 6.5 1.9"/>
			<path d="M12 6.5c1.6-1.3 3.6-1.9 6.5-1.9h2v13h-2c-2.9 0-4.9.6-6.5 1.9"/>
			<path d="M12 6.5v13"/>
		</symbol>
		<symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<circle cx="12" cy="12" r="4"/>
			<path d="M12 2.6v2.1"/><path d="M12 19.3v2.1"/>
			<path d="M4.9 4.9 6.4 6.4"/><path d="M17.6 17.6l1.5 1.5"/>
			<path d="M2.6 12h2.1"/><path d="M19.3 12h2.1"/>
			<path d="M4.9 19.1 6.4 17.6"/><path d="M17.6 6.4 19.1 4.9"/>
		</symbol>
		<symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"/>
		</symbol>
		<symbol id="icon-user" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- The signed-in operator, shown next to their name. -->
			<circle cx="12" cy="8" r="3.75"/>
			<path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
		</symbol>
		<symbol id="icon-signout" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- A door with an arrow leaving through it. -->
			<path d="M14 4.5H6.5A1.5 1.5 0 0 0 5 6v12a1.5 1.5 0 0 0 1.5 1.5H14"/>
			<path d="M11 12h9"/>
			<path d="M17 9l3 3-3 3"/>
		</symbol>
		<symbol id="icon-github" viewBox="0 0 16 16" fill="currentColor">
			<!-- The GitHub mark, filled rather than stroked like the icons above. -->
			<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
		</symbol>
	</svg>

	<div class="gw-shell" id="gw-shell">
		<aside class="gw-sidebar">
			<div class="gw-sidebar-header">
				<span class="gw-brand">
					<img class="gw-brand-logo" th:src="@{/img/icon.png}" src="/img/icon.png" alt="">
					<span class="gw-brand-label">Gateway</span>
				</span>
				<button type="button" class="gw-toggle" id="gw-toggle" aria-label="Toggle menu"
						aria-expanded="true">
					<svg class="gw-icon"><use href="#icon-menu"></use></svg>
				</button>
			</div>
			<nav class="gw-nav">
				<a th:each="item : ${navItems}" class="gw-nav-link"
						th:classappend="${item.id() == activeNav} ? 'active'"
						th:href="@{${item.href()}}" th:title="${item.label()}" href="#">
					<svg class="gw-icon"><use th:attr="href='#' + ${item.icon()}" href="#icon-plugin"></use></svg>
					<span class="gw-nav-label" th:text="${item.label()}">Label</span>
				</a>
			</nav>
			<!-- Only drawn when the console authenticates: there is no principal otherwise. -->
			<div class="gw-user" th:if="${currentUser != null}">
				<svg class="gw-icon"><use href="#icon-user"></use></svg>
				<span class="gw-nav-label" th:text="${currentUser}">operator</span>
			</div>
			<div class="gw-sidebar-footer">
				<a class="gw-footer-btn" href="https://github.com/nexsol-technologies/spring-cloud-gateway-plugins"
						target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub">
					<svg class="gw-icon"><use href="#icon-github"></use></svg>
				</a>
				<!-- Dropped with the other labels when the menu is collapsed. -->
				<span class="gw-version gw-nav-label" th:if="${uiVersion != null}"
						th:text="${uiVersion}">1.0.0</span>
				<button type="button" class="gw-footer-btn" id="gw-theme" title="Light or dark theme"
						aria-label="Light or dark theme">
					<svg class="gw-icon gw-theme-sun"><use href="#icon-sun"></use></svg>
					<svg class="gw-icon gw-theme-moon"><use href="#icon-moon"></use></svg>
				</button>
				<!-- A POST, so that ending the session is not something a link can be tricked into. -->
				<form th:if="${currentUser != null}" th:action="@{/ui/logout}" action="/ui/logout" method="post">
					<input type="hidden" th:if="${_csrf != null}"
							th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<button type="submit" class="gw-footer-btn" title="Sign out" aria-label="Sign out">
						<svg class="gw-icon"><use href="#icon-signout"></use></svg>
					</button>
				</form>
			</div>
		</aside>
		<main class="gw-content">
			<div th:replace="${content}">Page content</div>
		</main>
	</div>

	<script th:src="@{/js/htmx.min.js}" src="/js/htmx.min.js"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}" src="/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/gateway-ui.js}" src="/js/gateway-ui.js"></script>
	<!-- Page-specific scripts, injected after the vendor bundles so they can use them. -->
	<th:block th:replace="${scripts}"></th:block>
</body>
</html>
