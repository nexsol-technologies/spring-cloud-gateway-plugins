<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, scripts)">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${title}">Spring Cloud Gateway</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/gateway-ui.css}" href="/css/gateway-ui.css">
</head>
<body class="bg-body-tertiary">
	<!-- Inline SVG sprite: each NavItem references a symbol by id through its icon field. -->
	<svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
		<symbol id="icon-gateway" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
			<!-- Routing connectors: one client on the left, three services on the right. -->
			<path d="M4.9 12H9.25"/>
			<path d="M14.75 12H19.1"/>
			<path d="M14.75 10.6 19.3 5.9"/>
			<path d="M14.75 13.4 19.3 18.1"/>
			<!-- Gateway node. -->
			<rect x="9.25" y="9.25" width="5.5" height="5.5" rx="1.4"/>
			<!-- Client and service nodes. -->
			<circle cx="3.4" cy="12" r="1.5" fill="currentColor" stroke="none"/>
			<circle cx="20.6" cy="5" r="1.5" fill="currentColor" stroke="none"/>
			<circle cx="20.6" cy="12" r="1.5" fill="currentColor" stroke="none"/>
			<circle cx="20.6" cy="19" r="1.5" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
		</symbol>
		<symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>
		</symbol>
		<symbol id="icon-plugin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/>
			<rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>
		</symbol>
		<symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M4 4v16h16"/>
			<circle cx="9" cy="14.5" r="1.7" fill="currentColor" stroke="none"/>
			<circle cx="13.5" cy="9" r="1.7" fill="currentColor" stroke="none"/>
			<circle cx="18" cy="12.5" r="1.7" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-route" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- A path branching from one entry point to two exits. -->
			<path d="M6 19V9a3 3 0 0 1 3-3h9"/>
			<path d="M15 3l3 3-3 3"/>
			<path d="M6 13h6a3 3 0 0 1 3 3v2"/>
			<circle cx="6" cy="20.5" r="1.5" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- Concentric rings: testing a request against the route table. -->
			<circle cx="12" cy="12" r="8.5"/>
			<circle cx="12" cy="12" r="4.5"/>
			<circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- A log: successive entries, newest on top. -->
			<path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/>
			<circle cx="4.75" cy="6" r="1.3" fill="currentColor" stroke="none"/>
			<circle cx="4.75" cy="12" r="1.3" fill="currentColor" stroke="none"/>
			<circle cx="4.75" cy="18" r="1.3" fill="currentColor" stroke="none"/>
		</symbol>
		<symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor"
				stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
			<!-- An open book: the API contracts served by the gateway. -->
			<path d="M12 6.5C10.4 5.2 8.4 4.6 5.5 4.6H3.5v13h2c2.9 0 4.9.6 6.5 1.9"/>
			<path d="M12 6.5c1.6-1.3 3.6-1.9 6.5-1.9h2v13h-2c-2.9 0-4.9.6-6.5 1.9"/>
			<path d="M12 6.5v13"/>
		</symbol>
		<symbol id="icon-github" viewBox="0 0 16 16" fill="currentColor">
			<!-- The GitHub mark, filled rather than stroked like the icons above. -->
			<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
		</symbol>
	</svg>

	<div class="gw-shell" id="gw-shell">
		<aside class="gw-sidebar">
			<div class="gw-sidebar-header">
				<span class="gw-brand">
					<svg class="gw-icon"><use href="#icon-gateway"></use></svg>
					<span class="gw-brand-label">Gateway</span>
				</span>
				<button type="button" class="gw-toggle" id="gw-toggle" aria-label="Toggle menu"
						aria-expanded="true">
					<svg class="gw-icon"><use href="#icon-menu"></use></svg>
				</button>
			</div>
			<nav class="gw-nav">
				<a th:each="item : ${navItems}" class="gw-nav-link"
						th:classappend="${item.id() == activeNav} ? 'active'"
						th:href="@{${item.href()}}" th:title="${item.label()}" href="#">
					<svg class="gw-icon"><use th:attr="href='#' + ${item.icon()}" href="#icon-plugin"></use></svg>
					<span class="gw-nav-label" th:text="${item.label()}">Label</span>
				</a>
			</nav>
			<div class="gw-sidebar-footer">
				<a class="gw-nav-link" href="https://github.com/nexsol-technologies/spring-cloud-gateway-plugins"
						target="_blank" rel="noopener noreferrer" title="GitHub">
					<svg class="gw-icon"><use href="#icon-github"></use></svg>
					<span class="gw-nav-label">GitHub</span>
				</a>
			</div>
		</aside>
		<main class="gw-content">
			<div th:replace="${content}">Page content</div>
		</main>
	</div>

	<script th:src="@{/js/htmx.min.js}" src="/js/htmx.min.js"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}" src="/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/gateway-ui.js}" src="/js/gateway-ui.js"></script>
	<!-- Page-specific scripts, injected after the vendor bundles so they can use them. -->
	<th:block th:replace="${scripts}"></th:block>
</body>
</html>
