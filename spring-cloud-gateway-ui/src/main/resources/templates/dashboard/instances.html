<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
		th:replace="~{dashboard/fragments/layout :: layout('Spring Cloud Gateway — Runtime', ~{:: #instances-content}, ~{:: #instances-scripts})}">
<body>
	<div id="instances-content">
		<div th:replace="~{dashboard/fragments/view-band :: band('icon-server', 'Runtime', '',
				'gi-coverage')}"></div>

		<p class="text-secondary small mb-2">
			The technical health of each gateway instance &mdash; memory, processor, threads and the
			connection pools towards the downstream services. One row per instance, so a figure is
			read down its column across the whole fleet; open a row for the pools of that instance.
		</p>

		<div class="card border-0 shadow-sm">
			<div class="card-body">
				<div class="d-flex gap-3 align-items-center justify-content-end mb-3">
					<!-- How long ago the figures were read, ticking on its own between two
					     refreshes: a view left open on a dead poll must not look live. -->
					<span class="text-secondary small" id="gi-age"></span>
					<div class="form-check form-switch mb-0">
						<input class="form-check-input" type="checkbox" id="gi-auto" checked>
						<label class="form-check-label small" for="gi-auto">Auto</label>
					</div>
					<button type="button" id="gi-refresh" class="btn btn-sm btn-outline-primary">Refresh</button>
				</div>

				<!-- The fleet table, rendered from the payload into the card this page owns:
				     the script replaces this element wholesale on every refresh, and the
				     controls above it have listeners that must survive that. -->
				<div id="gi-instances" th:attr="data-url=@{/ui/metrics/instances/data}"
						data-url="/ui/metrics/instances/data"></div>

				<div id="gi-empty" class="text-secondary text-center py-5" style="display: none">
					No instance reported its figures.
				</div>
			</div>
		</div>
	</div>

	<div id="instances-scripts">
		<script th:src="@{/js/gateway-instances.js}" src="/js/gateway-instances.js"></script>
	</div>
</body>
</html>
