<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Spring Cloud Gateway &mdash; Sign in</title>
	<link rel="icon" type="image/png" th:href="@{/img/icon.png}" href="/img/icon.png">
	<link rel="apple-touch-icon" th:href="@{/img/icon.png}" href="/img/icon.png">
	<!--
		Same early theme switch as the shell: the console remembers the choice made in its
		side menu, and signing back in must not flash the other theme on the way.
	-->
	<script>
		(function () {
			var chosen = null;
			try {
				chosen = localStorage.getItem('gw-theme');
			}
			catch (ignored) {
				// Storage refused by the browser: the system preference decides.
			}
			document.documentElement.setAttribute('data-bs-theme',
					chosen || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
		})();
	</script>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" href="/css/bootstrap.min.css">
	<link rel="stylesheet" th:href="@{/css/gateway-ui.css}" href="/css/gateway-ui.css">
</head>
<body class="bg-body-tertiary">
	<main class="gw-login">
		<div class="card border-0 shadow-sm gw-login-card">
			<div class="card-body p-4 p-sm-5">
				<div class="text-center mb-4">
					<!-- The lockup of the home page, in the two drawings the themes need. -->
					<img class="gw-login-logo gw-logo-light" th:src="@{/img/logo.png}" src="/img/logo.png"
							alt="neXsol Spring Cloud Gateway Plugins">
					<img class="gw-login-logo gw-logo-dark" th:src="@{/img/logo-dark.png}" src="/img/logo-dark.png"
							alt="" aria-hidden="true">
					<p class="text-secondary mb-0 mt-3">Sign in to the gateway console.</p>
				</div>

				<div class="alert alert-danger py-2" role="alert" th:if="${loginError}">
					Wrong user name or password.
				</div>
				<div class="alert alert-danger py-2" role="alert" th:if="${oauth2Error}">
					The identity provider refused the sign-in. The gateway logs say why.
				</div>
				<div class="alert alert-success py-2" role="alert" th:if="${loggedOut}">
					You are signed out.
				</div>

				<!--
					One button per registered provider; absent when none is configured. Drawn
					as the alternative to the form rather than as a second submit button, so
					the two ways in do not read as the same one twice.
				-->
				<div th:if="${not #maps.isEmpty(oauth2Providers)}">
					<a th:each="provider : ${oauth2Providers}" class="btn btn-outline-primary w-100 mb-2"
							th:href="@{/oauth2/authorization/{id}(id=${provider.key})}"
							href="#" th:text="'Sign in with ' + ${provider.value}">Sign in with the provider</a>
					<div class="gw-login-divider text-secondary small" th:if="${credentialsForm}">or</div>
				</div>

				<form th:if="${credentialsForm}" th:action="@{/ui/login}" action="/ui/login" method="post">
					<input type="hidden" th:if="${_csrf != null}"
							th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<div class="mb-3">
						<label class="form-label" for="username">User name</label>
						<input class="form-control" type="text" id="username" name="username"
								autocomplete="username" required autofocus>
					</div>
					<div class="mb-4">
						<label class="form-label" for="password">Password</label>
						<input class="form-control" type="password" id="password" name="password"
								autocomplete="current-password" required>
					</div>
					<button class="btn btn-primary w-100" type="submit">Sign in</button>
				</form>
			</div>
		</div>
	</main>
</body>
</html>
