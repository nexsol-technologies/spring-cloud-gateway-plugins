<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
		th:replace="~{dashboard/fragments/layout :: layout('Spring Cloud Gateway — Traffic', ~{:: #metrics-content}, ~{:: #metrics-scripts})}">
<body>
	<div id="metrics-content">
		<header class="mb-4">
			<h1 class="h3 fw-bold mb-1">Traffic</h1>
			<p class="text-secondary mb-0">Every routed request as a bubble, plotted from the gateway metrics.</p>
		</header>

		<div class="card border-0 shadow-sm mb-3">
			<div class="card-body">
				<div class="row g-3 align-items-end">
					<div class="col-6 col-md">
						<label class="form-label small text-secondary mb-1" for="gm-x">X axis</label>
						<select id="gm-x" class="form-select form-select-sm">
							<option value="count" selected>Calls</option>
							<option value="avgMs">Avg latency (ms)</option>
							<option value="maxMs">Max latency (ms)</option>
							<option value="errorCount">Errors</option>
							<option value="errorRate">Error rate (%)</option>
						</select>
					</div>
					<div class="col-6 col-md">
						<label class="form-label small text-secondary mb-1" for="gm-y">Y axis</label>
						<select id="gm-y" class="form-select form-select-sm">
							<option value="count">Calls</option>
							<option value="avgMs" selected>Avg latency (ms)</option>
							<option value="maxMs">Max latency (ms)</option>
							<option value="errorCount">Errors</option>
							<option value="errorRate">Error rate (%)</option>
						</select>
					</div>
					<div class="col-6 col-md" id="gm-z-wrap" style="display: none">
						<label class="form-label small text-secondary mb-1" for="gm-z">Z axis</label>
						<select id="gm-z" class="form-select form-select-sm">
							<option value="count">Calls</option>
							<option value="avgMs">Avg latency (ms)</option>
							<option value="maxMs">Max latency (ms)</option>
							<option value="errorCount" selected>Errors</option>
							<option value="errorRate">Error rate (%)</option>
						</select>
					</div>
					<div class="col-6 col-md">
						<label class="form-label small text-secondary mb-1" for="gm-size">Bubble size</label>
						<select id="gm-size" class="form-select form-select-sm">
							<option value="count" selected>Calls</option>
							<option value="avgMs">Avg latency (ms)</option>
							<option value="maxMs">Max latency (ms)</option>
							<option value="errorCount">Errors</option>
							<option value="errorRate">Error rate (%)</option>
						</select>
					</div>
					<div class="col-auto">
						<div class="form-check form-switch">
							<input class="form-check-input" type="checkbox" role="switch" id="gm-3d">
							<label class="form-check-label small" for="gm-3d">3D</label>
						</div>
						<div class="form-check form-switch">
							<input class="form-check-input" type="checkbox" role="switch" id="gm-auto">
							<label class="form-check-label small" for="gm-auto">Auto</label>
						</div>
					</div>
					<div class="col-auto">
						<button type="button" id="gm-refresh" class="btn btn-sm btn-outline-primary">Refresh</button>
					</div>
				</div>
			</div>
		</div>

		<div class="card border-0 shadow-sm">
			<div class="card-body">
				<div id="gm-chart" style="width: 100%; height: 70vh; min-height: 440px"
						th:attr="data-url=@{/ui/metrics/data}" data-url="/ui/metrics/data"></div>
				<div id="gm-empty" class="text-secondary text-center py-5" style="display: none">
					No route metrics yet &mdash; send some traffic through the gateway, then refresh.
				</div>
				<p class="text-secondary small mb-0 mt-2">
					Bubble size follows the selected metric; colour shows the error rate (green &rarr; red).
				</p>
			</div>
		</div>
	</div>

	<div id="metrics-scripts">
		<script th:src="@{/js/echarts.min.js}" src="/js/echarts.min.js"></script>
		<script th:src="@{/js/echarts-gl.min.js}" src="/js/echarts-gl.min.js"></script>
		<script th:src="@{/js/gateway-metrics.js}" src="/js/gateway-metrics.js"></script>
	</div>
</body>
</html>
