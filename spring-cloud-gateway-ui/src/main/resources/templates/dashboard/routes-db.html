<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
		th:replace="~{dashboard/fragments/layout :: layout('Spring Cloud Gateway — Routes', ~{:: #routes-content}, ~{:: #routes-scripts})}">
<body>
	<div id="routes-content">
		<header class="mb-4">
			<h1 class="h3 fw-bold mb-1">Database routes</h1>
			<p class="text-secondary mb-0" th:unless="${readOnly}">Manage the Spring Cloud Gateway routes stored in the database.</p>
			<p class="text-secondary mb-0" th:if="${readOnly}">The Spring Cloud Gateway routes stored in the database. This gateway
				publishes them for reading only.</p>
		</header>

		<div class="row g-4">
			<div class="col-12" th:classappend="${readOnly} ? '' : 'col-lg-6'">
				<div th:replace="~{dashboard/fragments/route-db-list :: list}"></div>
			</div>
			<div class="col-12 col-lg-6" th:unless="${readOnly}">
				<div th:replace="~{dashboard/fragments/route-db-form :: form}"></div>
			</div>
		</div>

		<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

		<!-- Confirmation dialog used in place of the native window.confirm() for hx-confirm. -->
		<div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-modal-title" aria-hidden="true"
			th:unless="${readOnly}">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="confirm-modal-title">Please confirm</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body" id="confirm-modal-body">Are you sure?</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
						<button type="button" class="btn btn-danger" id="confirm-modal-ok">Delete</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script id="routes-scripts" th:inline="none">
		// Bridge HTMX's HX-Trigger "showToast" events onto a Bootstrap toast.
		document.body.addEventListener('showToast', function (evt) {
			var detail = evt.detail || {};
			var level = detail.level || 'info';
			var background = level === 'success' ? 'text-bg-success'
				: (level === 'error' ? 'text-bg-danger' : 'text-bg-secondary');
			var toast = document.createElement('div');
			toast.className = 'toast align-items-center border-0 ' + background;
			toast.setAttribute('role', 'alert');
			toast.innerHTML = '<div class="d-flex"><div class="toast-body"></div>' +
				'<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>';
			toast.querySelector('.toast-body').textContent = detail.message || '';
			document.getElementById('toast-container').appendChild(toast);
			var instance = new bootstrap.Toast(toast, { delay: 4000 });
			instance.show();
			toast.addEventListener('hidden.bs.toast', function () { toast.remove(); });
		});

		// A route requires at least one predicate: disable the remove button of the last
		// predicate row. Filters have no such constraint and stay removable.
		function gwSyncPredicateButtons() {
			var rows = document.querySelectorAll('#predicate-rows .element-row');
			var onlyOne = rows.length <= 1;
			rows.forEach(function (row) {
				var button = row.querySelector('.remove-element');
				if (button) { button.disabled = onlyOne; }
			});
		}

		function gwRemoveRow(button) {
			var inPredicates = button.closest('#predicate-rows');
			if (inPredicates && document.querySelectorAll('#predicate-rows .element-row').length <= 1) {
				return;
			}
			button.closest('.element-row').remove();
			gwSyncPredicateButtons();
		}

		document.addEventListener('DOMContentLoaded', gwSyncPredicateButtons);
		document.body.addEventListener('htmx:afterSwap', gwSyncPredicateButtons);

		// Rows appended via HTMX (new predicate/filter rows) are not always wired up by the
		// automatic post-swap processing; re-process the swapped content so their selects
		// become interactive. htmx.process is idempotent, so this does not double-bind.
		document.body.addEventListener('htmx:afterSwap', function (evt) {
			if (window.htmx) {
				window.htmx.process(evt.target);
			}
		});

		// Replace the native window.confirm() (hx-confirm) with a Bootstrap modal.
		(function () {
			var modalElement = document.getElementById('confirm-modal');
			var modal = new bootstrap.Modal(modalElement);
			var messageElement = document.getElementById('confirm-modal-body');
			var confirmButton = document.getElementById('confirm-modal-ok');
			var pendingRequest = null;

			document.body.addEventListener('htmx:confirm', function (evt) {
				if (!evt.detail.question) {
					return;
				}
				evt.preventDefault();
				messageElement.textContent = evt.detail.question;
				pendingRequest = evt.detail.issueRequest;
				modal.show();
			});

			confirmButton.addEventListener('click', function () {
				var issue = pendingRequest;
				pendingRequest = null;
				modal.hide();
				if (issue) { issue(true); }
			});

			modalElement.addEventListener('hidden.bs.modal', function () {
				pendingRequest = null;
			});
		})();
	</script>
</body>
</html>
